<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DWG 地块坐标 & DXF 转换</title>
<style>
:root{
  --accent:#0A84FF;
  --accent2:#5E5CE6;
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --stroke:rgba(255,255,255,.6);
  --text:#1c1c1e;
  --text-2:#636366;
  --radius-l:32px;
  --radius-m:22px;
  --radius-s:15px;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --glass:rgba(28,28,30,.5);
    --glass-strong:rgba(30,30,32,.68);
    --stroke:rgba(255,255,255,.14);
    --text:#f5f5f7;
    --text-2:#98989d;
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;
  color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;position:relative;overflow:hidden;background:#eef1f6;
}
/* 流动光斑背景 —— Liquid Glass 质感来源 */
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(80px);opacity:.6;z-index:0;
  animation:float 18s ease-in-out infinite;
}
body::before{width:540px;height:540px;background:radial-gradient(circle at 30% 30%,#7aa7ff,#5e5ce6);top:-130px;left:-90px}
body::after{width:500px;height:500px;background:radial-gradient(circle at 70% 70%,#ff9ec7,#ff6b9d);bottom:-150px;right:-110px;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.08)}}

.glass{
  background:var(--glass);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--stroke);
  box-shadow:0 30px 70px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.5);
}
.card{position:relative;z-index:1;width:100%;max-width:460px;padding:38px 32px;border-radius:var(--radius-l);text-align:center}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:7px 14px;border-radius:100px;background:var(--glass-strong);border:1px solid var(--stroke);color:var(--text-2);margin-bottom:18px;backdrop-filter:blur(20px)}
h1{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.sub{font-size:15px;color:var(--text);font-weight:500;margin-bottom:4px}
.desc{font-size:13px;color:var(--text-2);margin-bottom:26px;line-height:1.5}

.dropzone{position:relative;border:2px dashed var(--stroke);border-radius:var(--radius-m);padding:44px 22px;cursor:pointer;transition:.4s var(--spring);background:var(--glass-strong);overflow:hidden}
.dropzone:hover,.dropzone.dragover{border-color:var(--accent);transform:scale(1.015);background:rgba(10,132,255,.08)}
.dropzone.has-file{border-style:solid;border-color:#34c759;background:rgba(52,199,89,.1)}
.dz-icon{font-size:46px;margin-bottom:10px;transition:.4s var(--spring)}
.dropzone.dragover .dz-icon{transform:scale(1.15) translateY(-4px)}
.dz-text{font-size:16px;font-weight:600}
.dz-hint{font-size:13px;color:var(--text-2);margin-top:4px}
.dropzone input[type=file]{display:none}
.file-info{display:none;margin-top:14px;padding:11px 16px;border-radius:var(--radius-s);background:var(--glass-strong);border:1px solid var(--stroke);font-size:13px;font-weight:500;color:var(--text);text-align:left}
.file-info.show{display:block;animation:pop .4s var(--spring)}

.convert-btn{width:100%;margin-top:20px;padding:15px;border:none;border-radius:var(--radius-s);font-size:17px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 28px rgba(10,132,255,.4);transition:.3s var(--spring)}
.convert-btn:hover{transform:translateY(-2px);box-shadow:0 18px 36px rgba(10,132,255,.5)}
.convert-btn:active{transform:scale(.97)}
.convert-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;filter:grayscale(.3)}

.progress-area{display:none;margin-top:22px;text-align:left}
.progress-area.show{display:block;animation:pop .4s var(--spring)}
.p-item{display:flex;align-items:center;gap:12px;padding:11px 0;font-size:14.5px;color:var(--text)}
.spinner{width:18px;height:18px;border:2.5px solid rgba(120,120,128,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.check,.cross{width:22px;text-align:center;font-size:19px;flex:none}
.check{color:#34c759}.cross{color:#ff3b30}

.results{display:none;margin-top:18px;flex-direction:column;gap:12px}
.results.show{display:flex;animation:pop .45s var(--spring)}
.r-btn{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:var(--radius-s);text-decoration:none;font-size:14.5px;font-weight:600;color:#fff;transition:.3s var(--spring);border:1px solid rgba(255,255,255,.25)}
.r-btn:hover{transform:translateY(-2px)}
.r-btn .label{display:flex;align-items:center;gap:9px}
.r-btn .size{font-size:12px;font-weight:400;opacity:.85}
.r-btn.pol{background:linear-gradient(135deg,#30d158,#28cd41)}
.r-btn.dxf{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.r-btn.failed{background:var(--glass-strong);color:var(--text-2);border:1px solid var(--stroke)}

.error{display:none;margin-top:14px;padding:12px 16px;border-radius:var(--radius-s);font-size:13px;text-align:left;line-height:1.5;color:#ff3b30;background:rgba(255,59,48,.1);border:1px solid rgba(255,59,48,.25)}
.error.show{display:block;animation:pop .4s var(--spring)}
.priority-info{display:none;margin-top:14px;padding:12px 16px;border-radius:var(--radius-s);font-size:12px;text-align:left;line-height:1.6;color:var(--text-2);background:var(--glass-strong);border:1px solid var(--stroke)}
.priority-info.show{display:block}
.info-note{margin-top:18px;padding:11px 16px;border-radius:var(--radius-s);font-size:12px;text-align:left;line-height:1.5;color:var(--text-2);background:var(--glass-strong);border:1px solid var(--stroke)}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="card glass">
  <div class="badge" id="badge">⚡ 浏览器端处理，文件不离开本机</div>
  <h1>📐 DWG 转换</h1>
  <p class="sub">上传 DWG，同步获取坐标与 DXF</p>
  <p class="desc">一次上传，自动生成坐标文件（txt）与完整 DXF 文件</p>
  <div class="dropzone" id="dropzone">
    <div class="dz-icon">📁</div>
    <div class="dz-text">拖拽 DWG 文件到此处</div>
    <div class="dz-hint">或点击选择文件</div>
    <input type="file" id="fileInput" accept=".dwg">
    <div class="file-info" id="fileInfo"></div>
  </div>
  <button class="convert-btn" id="convertBtn" disabled>🔄 开始转换</button>
  <div class="progress-area" id="progressArea">
    <div class="p-item" id="polProgress"><span id="polIcon" class="spinner"></span><span id="polText">等待...</span></div>
    <div class="p-item" id="dxfProgress"><span id="dxfIcon" class="spinner"></span><span id="dxfText">等待...</span></div>
  </div>
  <div class="results" id="results"></div>
  <div class="error" id="error"></div>
  <div class="priority-info" id="priorityInfo"></div>
  <div class="info-note">💡 大文件也能处理，无服务器限制。所有计算在浏览器本地完成。</div>
</div>

<script src="wasm/dwg2pol.js"></script>
<script src="wasm/dxfgen.js"></script>
<script>
(function(){
var dz=document.getElementById('dropzone');
var fi=document.getElementById('fileInput');
var fi2=document.getElementById('fileInfo');
var cb=document.getElementById('convertBtn');
var pa=document.getElementById('progressArea');
var po=document.getElementById('polIcon');
var pt=document.getElementById('polText');
var di=document.getElementById('dxfIcon');
var dt=document.getElementById('dxfText');
var rs=document.getElementById('results');
var er=document.getElementById('error');
var pi=document.getElementById('priorityInfo');
var badge=document.getElementById('badge');
var f=null;
var wasmReady=false;
var wasmModule=null;
// 输出捕获闭包 — 在 createModule 时传入，通过此变量实现每调用重置
var wasmOutput=null;

// 加载 WASM
async function initWasm(){
  try{
    pt.textContent='正在加载 WASM 引擎(5MB,请稍候)...';
    po.textContent='';po.className='spinner';
    pa.classList.add('show');
    pt.textContent='正在编译 WASM(5MB,约需5-10秒)...';
    var initPromise=createModule({
      noInitialRun:true,
      print:function(t){if(wasmOutput)wasmOutput.push(t);else console.log(t)},
      printErr:function(t){if(wasmOutput)wasmOutput.push('[ERROR] '+t);else console.error(t)},
    });
    wasmModule=await Promise.race([
      initPromise,
      new Promise(function(_,reject){setTimeout(function(){reject(new Error('WASM 初始化超时(60秒)'))},60000)})
    ]);
    wasmReady=true;
    pa.classList.remove('show');
    badge.textContent='✅ WASM 引擎已就绪，可以处理文件';
    badge.style.background='#e8f5e9';
    badge.style.color='#2e7d32';
    cb.disabled=false;
    cb.textContent='🔄 开始转换';
  }catch(e){
    pa.classList.remove('show');
    er.textContent='WASM 加载失败: '+e.message;
    er.classList.add('show');
  }
}

// 解析坐标
function parsePolyText(text){
  var lines=text.split('\n').map(function(l){return l.trim()}).filter(function(l){return l});
  var coords=[];
  var areaHa=0;
  var inCoords=false;
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(line==='[地块坐标]'){inCoords=true;continue;}
    if(line.charAt(0)==='['&&line.charAt(line.length-1)===']'){inCoords=false;continue;}
    if(!inCoords)continue;
    var atMatch=line.match(/^(\d+),([\d.]+),1,1,面,,,,@$/);
    if(atMatch){areaHa=parseFloat(atMatch[2]);continue;}
    var ptMatch=line.match(/^J(\d+),1,([\d.]+),([\d.]+)$/);
    if(ptMatch){coords.push({x:parseFloat(ptMatch[3]),y:parseFloat(ptMatch[2])});}
  }
  return {coords:coords,areaHa:areaHa};
}

// 生成 DXF（注意：HEADER 中变量之间不能有 0 标记）
// 缓存模板
// 生成 DXF（使用外部脚本 dxfgen.js）
// UI
dz.onclick=function(){fi.click()};
dz.ondragover=function(e){e.preventDefault();dz.classList.add('dragover')};
dz.ondragleave=function(){dz.classList.remove('dragover')};
dz.ondrop=function(e){e.preventDefault();dz.classList.remove('dragover');handleFile(e.dataTransfer.files[0])};
fi.onchange=function(){if(fi.files[0])handleFile(fi.files[0])};
function handleFile(file){
  if(!file||!file.name.toLowerCase().endsWith('.dwg')){alert('请选择 DWG 文件');return}
  f=file;dz.classList.add('has-file');
  fi2.textContent='📄 '+file.name+' ('+(file.size/1024).toFixed(1)+' KB)';
  fi2.classList.add('show');
  if(wasmReady){cb.disabled=false;cb.textContent='🔄 转换 '+file.name}
}

// 处理文件
async function processFile(file){
  var buf=await file.arrayBuffer();
  var bytes=new Uint8Array(buf);
  var Module=wasmModule;
  wasmOutput=[];
  Module.FS.writeFile('/input.dwg',bytes);
  var callMainOk=typeof Module.callMain==='function';
  var exitCode=-1;
  try{exitCode=Module.callMain(['/input.dwg'])}catch(e){exitCode='ERR:'+e.message}
  try{Module.FS.unlink('/input.dwg')}catch(e){}
  var out=wasmOutput.join('\n');
  // 如果 stdout 为空，也尝试读取 /tmp/output.txt 或 /output.txt
  if(!out){
    try{var tmpFiles=Module.FS.readdir('/tmp');for(var i=0;i<tmpFiles.length;i++){var fn=tmpFiles[i];if(fn!=='.'&&fn!=='..'){var c=Module.FS.readFile('/tmp/'+fn,{encoding:'utf8'});if(c&&c.length>0){out=c;break}}}}catch(e){}
  }
  if(!out){
    try{var rootFiles=Module.FS.readdir('/');for(var i=0;i<rootFiles.length;i++){var fn=rootFiles[i];if(fn!=='.'&&fn!=='..'&&fn!=='input.dwg'){var c=Module.FS.readFile('/'+fn,{encoding:'utf8'});if(c&&c.length>0){out=c;break}}}}catch(e){}
  }
  // 如果还是空的，返回诊断信息
  if(!out){out='[DEBUG] callMain='+callMainOk+' exit='+exitCode+' (EMPTY)'}
  wasmOutput=null;
  return out;
}

cb.onclick=async function(){
  if(!f||!wasmReady)return;
  cb.disabled=true;
  er.classList.remove('show');rs.classList.remove('show');rs.innerHTML='';
  pi.classList.remove('show');
  pa.classList.add('show');
  po.textContent='';po.className='spinner';pt.textContent='正在提取坐标...';
  di.textContent='';di.className='spinner';dt.textContent='正在生成 DXF...';
  var nameBase=f.name.replace(/\.dwg$/i,'');
  var polName=nameBase+'_坐标.txt';
  var dxfName=nameBase+'.dxf';
  try{
    var rawText=await processFile(f);
    // ASCII → 中文翻译
    rawText=rawText.replace('[SHUXING]','[属性描述]').replace('ZUOBIAOXI=','坐标系=').replace('FENDAI=','几度分带=').replace('TOUYING=','投影类型=').replace('DANWEI=','计量单位=').replace('DAIHAO=','带号=').replace('JINGDU=','精度=').replace('ZHUANHUAN=','转换参数=').replace('[DKKZB]','[地块坐标]').replace('坐标系=2000','坐标系=2000国家大地坐标系').replace('投影类型=GK','投影类型=高斯克吕格').replace('计量单位=M','计量单位=米');
    rawText=rawText.split(',M,,,,@').join(',面,,,,@');
    // 移除 ===DXF-START=== 段
    var txtContent=rawText;
    var dxfMarker='===DXF-START===';
    if(txtContent.indexOf(dxfMarker)!==-1){
      txtContent=txtContent.split(dxfMarker)[0].trimEnd();
    }
    // 面积已经是公顷，无需转换
    // 解析坐标
    var parsed=parsePolyText(txtContent);
    var coords=parsed.coords;
    var areaHa=parsed.areaHa;
    // 坐标提取完成
    po.textContent='✅';po.className='check';pt.textContent='坐标提取完成';
    // 生成 DXF（独立容错：即使 DXF 失败，坐标结果仍正常展示）
    var dxfContent=null;
    try{
      var templateText=await loadTemplate();
      dxfContent=generateDxfFromTemplate(coords,templateText);
      di.textContent='✅';di.className='check';dt.textContent='DXF 生成完成';
    }catch(e){
      di.textContent='⚠️';di.className='cross';dt.textContent='DXF 生成跳过: '+e.message;
      dxfContent=null;
    }
    // 显示结果
    rs.classList.add('show');
    var polBlob=new Blob([txtContent],{type:'text/plain;charset=utf-8'});
    var polUrl=URL.createObjectURL(polBlob);
    var dxfBlob=dxfContent?new Blob([dxfContent],{type:'application/dxf'}):null;
    var dxfUrl=dxfBlob?URL.createObjectURL(dxfBlob):null;
    var html='';
    html+='<a class="result-btn pol" href="'+polUrl+'" download="'+polName+'"><span class="label">📝 坐标文件 (txt)</span><span class="size">'+(polBlob.size/1024).toFixed(1)+' KB</span></a>';
    if(dxfUrl){
      html+='<a class="result-btn dxf" href="'+dxfUrl+'" download="'+dxfName+'"><span class="label">📐 DXF 文件</span><span class="size">'+(dxfBlob.size/1024).toFixed(1)+' KB</span></a>';
    }
    if(coords.length>0){
      pi.textContent='提取优先级: ① jzd图层闭合线 → ② 红色闭合线(最多点) → ③ 最多点闭合线 | 共 '+coords.length+' 点，面积: '+areaHa.toFixed(3)+' 公顷';
      pi.classList.add('show');
    }
    rs.innerHTML=html;
  }catch(e){
    po.textContent='❌';po.className='cross';pt.textContent='提取失败: '+e.message;
    di.textContent='❌';di.className='cross';dt.textContent='DXF 生成失败';
    er.textContent='处理失败: '+e.message;
    er.classList.add('show');
  }finally{
    cb.disabled=false;
  }
};

// 启动
initWasm();
})();
</script>
</body>
</html>
